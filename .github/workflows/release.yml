name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch'
        required: true
        default: 'main'

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write

    env:
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACCESSCORE_GITHUB_USERNAME: ${{ github.actor }}
      ACCESSCORE_GITHUB_TOKEN: ${{ secrets.ACCESSCORE_GITHUB_TOKEN }}
      # Publishes @simplix-boot/cli to the public npm registry: an automation token with publish
      # rights on the @simplix-boot scope.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Verify license SDK credentials
        run: |
          if [ -z "$ACCESSCORE_GITHUB_TOKEN" ]; then
            echo "✖ Error: ACCESSCORE_GITHUB_TOKEN secret is not set."
            echo "  simplix-license resolves dev.accesscore:license-sdk from"
            echo "  https://maven.pkg.github.com/simplecore-inc/accesscore-license-sdk-dist,"
            echo "  which requires a token with the read:packages scope."
            exit 1
          fi

      # The CLI lives on the release lines that carry simplix-cli; a branch without it releases
      # the Maven artifacts alone.
      - name: Detect the CLI
        id: cli
        run: |
          if [ -f simplix-cli/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.cli.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: simplix-cli/package-lock.json

      # Checked before anything is published, so a missing or expired token cannot leave the
      # Maven artifacts released and the CLI of the same version unpublished.
      - name: Verify npm credentials
        if: steps.cli.outputs.present == 'true'
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "✖ Error: NPM_TOKEN secret is not set."
            echo "  The release publishes @simplix-boot/cli to npm with the framework version."
            exit 1
          fi
          npm whoami

      - name: Extract and validate version
        id: version
        run: |
          CURRENT_VERSION=$(grep "projectVersion = " build.gradle | sed "s/.*projectVersion = '\(.*\)'/\1/")
          echo "Current version: $CURRENT_VERSION"

          if [[ ! "$CURRENT_VERSION" =~ -SNAPSHOT$ ]]; then
            echo "✖ Error: Current version ($CURRENT_VERSION) is not a SNAPSHOT version."
            echo "  Release can only be performed from a SNAPSHOT version."
            exit 1
          fi

          RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          echo "✔ Release version: $RELEASE_VERSION"
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "release=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build
        run: |
          gradle clean build --stacktrace

      - name: Test the CLI
        if: steps.cli.outputs.present == 'true'
        working-directory: simplix-cli
        run: |
          npm ci
          npm test

      - name: Set release version
        run: |
          sed -i "s/projectVersion = '.*'/projectVersion = '${{ steps.version.outputs.release }}'/" build.gradle
          if [ "${{ steps.cli.outputs.present }}" = "true" ]; then
            (cd simplix-cli && npm version "${{ steps.version.outputs.release }}" --no-git-tag-version --allow-same-version)
          fi

      # The CLI is published before the Maven artifacts: a token without publish rights on the
      # @simplix-boot scope then fails while nothing has been released. A version npm already
      # holds is left as it is, so the workflow can be run again after a later step failed.
      # The dist-tag is the one package.json names for this release line.
      - name: Publish the CLI
        if: steps.cli.outputs.present == 'true'
        working-directory: simplix-cli
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: |
          PUBLISHED=$(npm view "@simplix-boot/cli@$RELEASE_VERSION" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$RELEASE_VERSION" ]; then
            echo "ℹ @simplix-boot/cli@$RELEASE_VERSION is already on npm, skipping"
          else
            TAG=$(node --input-type=commonjs -e "const tag = require('./package.json').publishConfig.tag; if (!tag) process.exit(1); console.log(tag)")
            npm publish --access public --tag "$TAG"
          fi

      - name: Publish
        run: |
          gradle publish --info --stacktrace

      - name: Commit and tag the release version
        env:
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          git config --global user.email "devteam@simplecore.dev"
          git config --global user.name "simplecore"
          git add build.gradle
          if [ "${{ steps.cli.outputs.present }}" = "true" ]; then
            git add simplix-cli/package.json simplix-cli/package-lock.json
          fi
          git commit -m "release: v${{ steps.version.outputs.release }}"
          git push origin "$RELEASE_BRANCH"
          git tag -a "v${{ steps.version.outputs.release }}" -m "v${{ steps.version.outputs.release }}"
          git push origin "v${{ steps.version.outputs.release }}"

      - name: Update to Next Development Version
        env:
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          NEXT_VERSION=$(echo ${{ steps.version.outputs.release }} | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')-SNAPSHOT
          sed -i "s/projectVersion = '.*'/projectVersion = '$NEXT_VERSION'/" build.gradle
          git add build.gradle
          if [ "${{ steps.cli.outputs.present }}" = "true" ]; then
            (cd simplix-cli && npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version)
            git add simplix-cli/package.json simplix-cli/package-lock.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare for next development version $NEXT_VERSION"
            git push origin "$RELEASE_BRANCH"
          else
            echo "Version already set to $NEXT_VERSION, skipping commit"
          fi

      - name: Generate Release Notes
        id: release_notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "v${{ steps.version.outputs.release }}^" 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            NOTES=$(git log --pretty=format:"* %s (%an)" --no-merges "v${{ steps.version.outputs.release }}" | grep -v "github-actions")
          else
            NOTES=$(git log --pretty=format:"* %s (%an)" --no-merges "$PREVIOUS_TAG..v${{ steps.version.outputs.release }}" | grep -v "github-actions")
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release }}
          name: Release v${{ steps.version.outputs.release }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
