name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/docs/ko/**'
      - '**/docs/en/**'
      - '**/README.md'
      - '**/README.ko.md'
      - 'scripts/build-docs.sh'
      - 'scripts/build-docs.mjs'
      - 'scripts/prepare-docs.mjs'
      - 'scripts/tests/docs-site.test.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build (e.g., 1.0.7). Leave empty for SNAPSHOT.'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || 'main' }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            IS_RELEASE="true"
          else
            VERSION=$(grep "projectVersion = " build.gradle | sed "s/.*projectVersion = '\([^']*\)'.*/\1/")
            IS_RELEASE="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Building documentation for version: $VERSION (release: $IS_RELEASE)"

      - name: Test the site tooling
        if: steps.version.outputs.is_release != 'true'
        run: node --test scripts/tests/docs-site.test.mjs

      - name: Build documentation
        env:
          DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/build-docs.sh
          ./scripts/build-docs.sh

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      # The shell of the site and the script that combines the versions always come from main, so
      # a release built from its tag is published with the current navigation.
      - name: Checkout current site tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: .docs-tooling
          sparse-checkout: |
            docs/index.html
            docs/assets
            scripts/prepare-docs.mjs
          sparse-checkout-cone-mode: false

      - name: Prepare deployment
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then FOLDER_NAME="$VERSION"; else FOLDER_NAME="snapshot"; fi
          mkdir -p gh-pages
          node .docs-tooling/scripts/prepare-docs.mjs gh-pages build-docs deploy "$FOLDER_NAME"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: false
